services:
  postgres:
    image: postgres:16
    container_name: dpi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dpi_trust_db
      POSTGRES_USER: dpi_user
      POSTGRES_PASSWORD: dpi_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  opa:
    image: openpolicyagent/opa:0.70.0
    container_name: dpi-opa
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ./opa:/policies:ro

volumes:
  postgres_data:
